services:
  - type: web
    name: rag-document-qa
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: rag-data
      mountPath: /var/data
      sizeGB: 1
